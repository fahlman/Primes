name: Swift 6.4 vs 6.3.3 timing on x86-64

# One approved comparison (Ryan, 2026-10-04): upstream's merged Swift entry built
# with its Dockerfile's Swift 6.3.3 images and with Swift 6.4.0 images, timed in
# rotated order on the same runner.
on:
  push:
    branches: [claude/swift-64-x64-timing]

permissions:
  contents: read

env:
  # Upstream's merge of the entry, PlummersSoftwareLLC/Primes#1083.
  UPSTREAM_REVISION: 95b6354127d72f60ebe006615921c682ae9c1d0c

jobs:
  compare:
    if: github.repository == 'fahlman/Primes'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out upstream's merged Swift solution
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: PlummersSoftwareLLC/Primes
          ref: ${{ env.UPSTREAM_REVISION }}
          sparse-checkout: PrimeSwift/solution_1
          persist-credentials: false

      - name: Record the machine
        run: |
          uname -a
          lscpu
          docker version --format 'Docker server {{.Server.Version}}'

      - name: Build both images
        working-directory: PrimeSwift/solution_1
        run: |
          set -eu
          # The only difference between the variants is the two base images.
          sed -e 's/^FROM swift:6\.3\.3 AS build$/FROM swift:6.4.0 AS build/' \
              -e 's/^FROM swift:6\.3\.3-slim$/FROM swift:6.4.0-slim/' \
              Dockerfile > Dockerfile.swift-6.4.0
          diff Dockerfile Dockerfile.swift-6.4.0 || true
          test "$(diff Dockerfile Dockerfile.swift-6.4.0 | grep -c '^[<>]')" -eq 4
          docker build --pull -f Dockerfile -t primes-swift:6.3.3 .
          docker build --pull -f Dockerfile.swift-6.4.0 -t primes-swift:6.4.0 .
          for tag in 6.3.3 6.3.3-slim 6.4.0 6.4.0-slim; do
            docker image inspect --format "swift:$tag {{index .RepoDigests 0}}" "swift:$tag"
          done
          docker run --rm swift:6.3.3 swift --version
          docker run --rm swift:6.4.0 swift --version

      - name: Time the striped entry in rotated order
        run: |
          set -eu
          binary=./PrimeSwift_1bitStriped_u8/.build/release/PrimeSieveSwift
          for round in 1 2 3 4 5; do
            if [ $((round % 2)) -eq 1 ]; then order="6.3.3 6.4.0"; else order="6.4.0 6.3.3"; fi
            for swift in $order; do
              output=$(docker run --rm --entrypoint "$binary" "primes-swift:$swift" 2>&1)
              echo "round=$round swift=$swift :: $(printf '%s' "$output" | tr '\n' ' ')"
            done
          done
