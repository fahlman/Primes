name: Swift Linux Docker validation

on:
  push:
    branches: [swift/linux-docker-validation]
    paths:
      - .github/workflows/swift-linux-docker-validation.yml
      - fork/swift/linux-docker/linux-validation.swift

permissions:
  contents: read

concurrency:
  group: swift-linux-docker-validation
  cancel-in-progress: false

env:
  # series: generic 3 of 4, amd64 only
  # The solution under test is independent of the workflow commit.
  SOLUTION_REVISION: 5cff8a7e80b4af11c8f58441790de7742e49d426

jobs:
  lint:
    name: Lint the solution Dockerfile as upstream's CI does
    if: github.repository == 'fahlman/Primes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact solution revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fahlman/Primes
          ref: ${{ env.SOLUTION_REVISION }}
          persist-credentials: false

      - name: Lint Dockerfile
        uses: jbergstroem/hadolint-gh-action@d2f58da7f4f242dc0b6c5ef882ad4f8e871ba96b # v1
        with:
          dockerfile: PrimeSwift/solution_1/Dockerfile
          output_format: tty
          error_level: 0
          config_file: ./config/hadolint.yml

  validate:
    name: Validate the adopted source on native ${{ matrix.architecture }}
    if: github.repository == 'fahlman/Primes'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false

      - name: Check out exact solution revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fahlman/Primes
          ref: ${{ env.SOLUTION_REVISION }}
          path: solution
          persist-credentials: false

      - name: Check owned Docker container cleanup
        run: |
          swift workflow/fork/swift/linux-docker/linux-validation.swift test-lifecycle \
            --docker-probe --output "$RUNNER_TEMP/swift-linux-docker-lifecycle"

      - name: Build Dockerfile and validate Swift on native Linux
        env:
          VALIDATION_PLATFORM: linux/${{ matrix.architecture }}
        run: |
          swift workflow/fork/swift/linux-docker/linux-validation.swift validate \
            --solution-root "$GITHUB_WORKSPACE/solution" \
            --solution-revision "$SOLUTION_REVISION" \
            --workflow-root "$GITHUB_WORKSPACE/workflow" \
            --platform "$VALIDATION_PLATFORM" \
            --output "$RUNNER_TEMP/swift-linux-docker-evidence" \
            --build-output "$RUNNER_TEMP/swift-linux-docker-checks"

      - name: Preserve validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-linux-${{ matrix.architecture }}-full-${{ env.SOLUTION_REVISION }}
          path: |
            ${{ runner.temp }}/swift-linux-docker-evidence/
            ${{ runner.temp }}/swift-linux-docker-lifecycle/
          if-no-files-found: warn
          retention-days: 30
